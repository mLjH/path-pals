<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Path Pals</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Path Pals">
<meta name="theme-color" content="#D8F0F6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-size:14px}
/* Layout: one-screen toy. Header with progress stars, a square board that fills the stage, one big round button below. */
:root{
  --bg:#D8F0F6;
  --ink:#1F3A44;
  --ink-soft:#4B6B76;
  --grass-a:#CDE9A6;
  --grass-b:#C0E096;
  --edge:#A5CA78;
  --edge-dark:#88B05C;
  --go:#1E9E57;
  --go-dark:#147A41;
  --sun:#FFD166;
  --sun-dark:#E0A92F;
  --paper:#FFFFFF;
  --up:#2F7DE1;
  --right:#F28C28;
  --down:#D6336C;
  --left:#7048E8;
  --font-display:'Fredoka',ui-rounded,'Segoe UI Rounded',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
button{font:inherit;color:inherit}
#app{height:100%;max-width:980px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

.top{display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:12px}
.dots{display:flex;align-items:center;gap:6px}
.star{width:26px;height:26px;transition:transform .25s}
.star path{stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.star.done path{fill:var(--sun)}
.star.now{transform:scale(1.3)}
.star.now path{fill:var(--paper)}
.star.later path{fill:transparent;stroke:var(--ink-soft);opacity:.45}
.gear{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.7);overflow:hidden;cursor:pointer;display:grid;place-items:center}
.gear svg{position:relative;width:22px;height:22px;z-index:1}
.gear .fill{position:absolute;inset:0;background:var(--sun);transform:scaleY(0);transform-origin:bottom;transition:transform .2s}
.gear.holding .fill{transform:scaleY(1);transition:transform .9s linear}

.stage{display:grid;place-items:center;min-height:0;min-width:0}
.board{position:relative;padding:10px;background:var(--edge);border-radius:26px;box-shadow:0 8px 0 var(--edge-dark),0 18px 28px rgba(31,58,68,.16)}
.grid{position:relative;display:grid;grid-template-columns:repeat(var(--cols),var(--cell));grid-template-rows:repeat(var(--rows),var(--cell))}
.grid.busy .tile{pointer-events:none}
.tile{position:relative;width:var(--cell);height:var(--cell);padding:0;margin:0;border:0;background:none;-webkit-tap-highlight-color:transparent;display:block}
button.tile{cursor:pointer}
.tile.hinted{z-index:5}
.face{position:absolute;inset:2px;border-radius:18%;background:var(--grass-a);transition:transform .08s}
.face.b{background:var(--grass-b)}
button.tile:active .face{transform:scale(.93)}
.tile.start .face::after{content:"";position:absolute;inset:12%;border:3px dashed rgba(255,255,255,.95);border-radius:50%}
.tile.goal .face{background:radial-gradient(circle at 50% 50%,#FFFBD6 0%,#FFEC8A 42%,#FFD84A 100%);box-shadow:inset 0 0 0 4px #FFC93C;animation:goalglow 1.6s ease-in-out infinite}
.halo{position:absolute;inset:2px;border-radius:18%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,244,160,.5) 45%,rgba(255,244,160,0) 72%);animation:halo 1.6s ease-in-out infinite}
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks i{position:absolute;display:block;transform:scale(0);animation:twinkle 1.5s ease-in-out infinite}
.sparks svg{display:block;width:100%;height:100%}
.tile.goal .obj svg{width:92%;height:92%}
.tile.goal .obj:not(.eaten) svg{animation:foodbob 1.4s ease-in-out infinite}
.obj,.arrow,.hintl{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.obj svg,.arrow svg{width:84%;height:84%;overflow:visible}
.arrow svg{animation:pop .22s cubic-bezier(.3,1.6,.5,1)}
.obj.eaten svg{animation:eat .5s ease-in forwards}
.obj.shake svg{animation:shake .4s}
.ring{position:absolute;inset:5%;border-radius:24%;border:5px solid var(--sun);animation:ring 1.1s ease-out infinite}
.ghost{position:absolute;inset:0;display:grid;place-items:center;opacity:.5}
.ghost svg{width:80%;height:80%}
.ghost.clear{opacity:1}
.ghost.clear i{width:56%;height:56%;border:5px dashed var(--ink-soft);border-radius:50%;display:block}
.hand{position:absolute;left:50%;top:50%;width:44%;transform:translate(-50%,-4%);animation:tap 1.2s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(31,58,68,.18))}
.hand svg{display:block;width:100%;height:auto}

.animals{position:absolute;inset:0;pointer-events:none}
.animal{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);
  transform:translate(calc(var(--x) * var(--cell)),calc(var(--y) * var(--cell)));
  transition:transform .42s cubic-bezier(.45,.05,.3,1),opacity .2s}
.hopper{position:absolute;inset:5%}
.flip{position:absolute;inset:0;transform:scaleX(var(--sx,1));transition:transform .18s}
.flip svg{width:100%;height:100%;overflow:visible}
.view{position:absolute;inset:0;display:none}
.flip[data-view="side"] .side,.flip[data-view="front"] .front,.flip[data-view="back"] .back{display:block}
.pupil{transform:translate(0px,var(--py,0px));transition:transform .15s}
.puff{position:absolute;width:calc(var(--cell) * .5);height:calc(var(--cell) * .5);margin:calc(var(--cell) * -.25) 0 0 calc(var(--cell) * -.25);border-radius:50%;
  background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.8) 40%,rgba(255,255,255,0) 70%);animation:puff .55s ease-out forwards;pointer-events:none}

.foot{display:grid;place-items:center;padding:10px 0 16px}
.cta{width:104px;height:104px;border-radius:50%;border:0;background:var(--go);box-shadow:0 8px 0 var(--go-dark);display:grid;place-items:center;cursor:pointer;transition:transform .08s,box-shadow .08s,opacity .2s;-webkit-tap-highlight-color:transparent}
.cta:active{transform:translateY(6px);box-shadow:0 2px 0 var(--go-dark)}
.cta svg{width:54%;height:54%}
.cta:disabled{opacity:.4;pointer-events:none}
.cta.next{background:var(--sun);box-shadow:0 8px 0 var(--sun-dark);animation:bob 1s ease-in-out infinite}
.cta.next:active{box-shadow:0 2px 0 var(--sun-dark)}
.cta.nudge{animation:wiggle 1s ease-in-out infinite}

.screen{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;align-content:center;gap:22px;text-align:center;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.screen[hidden]{display:none}
.logo{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(46px,13vw,88px);line-height:1;letter-spacing:.01em}
.party{display:flex;gap:4px;align-items:flex-end;justify-content:center}
.party svg{width:clamp(56px,15.5vw,112px);height:auto;overflow:visible;animation:bob 1.2s ease-in-out infinite}
#cheerParty svg{animation:joy .8s ease-in-out infinite}
#cheerParty svg:nth-child(2n){animation-delay:.15s}
#cheerParty svg:nth-child(3n){animation-delay:.3s}
.party svg:nth-child(2){animation-delay:.2s}
.party svg:nth-child(3){animation-delay:.4s}

.sheet{position:fixed;inset:0;z-index:30;background:rgba(31,58,68,.5);display:grid;place-items:center;padding:16px}
.sheet[hidden]{display:none}
.card{background:var(--paper);border-radius:22px;padding:20px;width:min(100%,380px);display:grid;gap:14px;box-shadow:0 12px 40px rgba(31,58,68,.3)}
.card h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:22px}
.card p{margin:0;font-size:14px;line-height:1.45;color:var(--ink-soft);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:44px;height:44px;padding:0 14px;border-radius:14px;border:2px solid var(--ink);background:var(--paper);font-weight:800;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip.main{background:var(--go);border-color:var(--go-dark);color:#fff}

#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:25}
.piece{position:absolute;top:-24px;width:12px;height:16px;border-radius:3px;animation:fall 1.9s ease-in forwards}

@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.12);opacity:0}}
@keyframes tap{0%,100%{transform:translate(-50%,-4%)}45%{transform:translate(-50%,14%)}}
@keyframes eat{0%{transform:scale(1)}30%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7%)}75%{transform:translateX(7%)}}
@keyframes puff{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
@keyframes goalglow{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.07) saturate(1.2)}}
@keyframes halo{0%,100%{transform:scale(.88);opacity:.7}50%{transform:scale(1.06);opacity:1}}
@keyframes twinkle{0%,100%{transform:scale(0) rotate(0deg);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
@keyframes foodbob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4%) scale(1.07)}}
@keyframes joy{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(2px) scale(1.06,.93)}50%{transform:translateY(-34px) scale(.96,1.06)}85%{transform:translateY(2px) scale(1.06,.93)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.cta.next:active,.cta:active{animation:none}
@media (prefers-reduced-motion:reduce){
  .piece{display:none}
  .ring,.hand,.cta.next,.cta.nudge,.party svg,#cheerParty svg,.halo,.tile.goal .face,.tile.goal .obj:not(.eaten) svg{animation:none}
  .sparks i{animation:none;transform:scale(1)}
  .animal{transition-duration:.01s}
}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

/* ---------- worlds: each grid size gets its own ground ---------- */
[hidden]{display:none!important}
.w-meadow,:root[data-world="meadow"]{--bg:#D8F0F6;--grass-a:#CDE9A6;--grass-b:#C0E096;--edge:#A5CA78;--edge-dark:#88B05C}
.w-beach,:root[data-world="beach"]{--bg:#CDEEFA;--grass-a:#F6E7BE;--grass-b:#EEDBA6;--edge:#DDBF7E;--edge-dark:#C3A05C}
.w-jungle,:root[data-world="jungle"]{--bg:#DCF1E2;--grass-a:#BFE29A;--grass-b:#AED688;--edge:#7FB35A;--edge-dark:#5F9140}
.w-grove,:root[data-world="grove"]{--bg:#E4F2E0;--grass-a:#DDF0D4;--grass-b:#CFE7C4;--edge:#9DC79A;--edge-dark:#7BA678}
body{transition:background-color .4s}

/* ---------- header ---------- */
.lead{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto}
.dots{min-width:0;flex:1 1 auto;gap:4px}
.dots .star{flex:0 1 26px;min-width:8px;width:auto;height:auto;aspect-ratio:1}

/* ---------- characters can be tapped to swap ---------- */
.animal{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.grid.busy .animal,.grid.won .animal{pointer-events:none;cursor:default}
.grid.snap .animal{transition:none!important}
.party{flex-wrap:wrap}
.party svg{width:clamp(38px,10.5vw,100px)}
.round{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:rgba(255,255,255,.7);display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.round svg{width:22px;height:22px}
.round:active{transform:scale(.92)}

/* ---------- level map ---------- */
.screen.map{display:block;place-items:normal;align-content:normal;overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:left;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
.mapwrap{max-width:760px;margin:0 auto;display:grid;gap:16px}
.mapbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.maptitle{margin:0;font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:.01em}
.worlds{display:grid;gap:18px}
.world{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;padding:12px;border-radius:24px;background:var(--edge);box-shadow:0 6px 0 var(--edge-dark)}
.wtag{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--grass-a)}
.mini{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;width:34px;height:34px}
.mini i{display:block;border-radius:2px;background:var(--edge-dark)}
.lvls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.lvl{position:relative;aspect-ratio:1;max-width:100%;border:0;padding:0;border-radius:22%;background:var(--grass-a);box-shadow:inset 0 -5px 0 var(--grass-b);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .08s}
.lvl:active{transform:scale(.93)}
/* each level button shows a tiny picture of its board, since characters change every time */
.thumb{position:absolute;inset:14%;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));gap:2px}
.thumb i{display:block;border-radius:24%;background:var(--grass-b)}
.thumb i.R{background:#8C98AE}
.thumb i.T{background:#2E8B57}
.thumb i.P{background:#A06A35}
.thumb i.G{background:#FFC93C;box-shadow:0 0 0 2px #FFF1A8}
.thumb i.S{background:#fff;border-radius:50%;box-shadow:0 0 0 1.5px var(--ink-soft)}
.lvl.done{background:#FFF4C2;box-shadow:inset 0 -5px 0 #F5DE85}
.badge{position:absolute;right:-7%;top:-7%;width:40%;height:40%;filter:drop-shadow(0 2px 0 rgba(31,58,68,.2))}
.badge path{fill:var(--sun);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.lvl.now::after{content:"";position:absolute;inset:-6px;border-radius:26%;border:5px solid var(--sun);animation:ring 1.2s ease-out infinite;pointer-events:none}
.lvl.locked{cursor:default}
.lvl.locked .thumb{opacity:.3;filter:grayscale(1)}
.lock{position:absolute;left:50%;top:50%;width:34%;height:34%;transform:translate(-50%,-50%)}
.lvl.nope{animation:shake .35s}

/* ---------- world and finale celebration ---------- */
.cheerstars{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cheerstars .star{width:46px;height:46px;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.cheerstars .star:nth-child(2){animation-delay:.12s}
.cheerstars .star:nth-child(3){animation-delay:.24s}
.cheerstars .star:nth-child(4){animation-delay:.36s}
.cheerstars .star:nth-child(5){animation-delay:.48s}
.cheerstars.many{max-width:420px;margin:0 auto}
.cheerstars.many .star{width:34px;height:34px}

/* ---------- grown-ups panel ---------- */
.card{width:min(100%,440px);max-height:calc(100% - 8px);overflow-y:auto}
.setrows{display:grid;gap:14px}
.setrow{display:grid;gap:6px}
.lab{font-weight:800;font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip:disabled{opacity:.4;cursor:default}
.chip.warn{border-color:#B83A2E;color:#B83A2E}
.chip.armed{background:#B83A2E;border-color:#B83A2E;color:#fff}

@media (prefers-reduced-motion:reduce){
  .lvl.now::after,.cheerstars .star{animation:none}
}

/* swiping across a square sets its arrow, so the board must not scroll or zoom under a finger */
.tile{touch-action:none}

/* ---------- bonus world: each character has its own goal ---------- */
.w-lagoon,:root[data-world="lagoon"]{--bg:#DDF3F7;--grass-a:#C9EEE6;--grass-b:#B8E4DA;--edge:#79C3B6;--edge-dark:#55A196}
.thumb i.g{background:#FFC93C;box-shadow:0 0 0 2px #FFF1A8}
.duo{position:relative;display:block;width:40px;height:40px}
.duo svg{position:absolute;width:28px;height:28px}
.duo svg:first-child{left:0;top:0}
.duo svg:last-child{right:0;bottom:0}

/* ---------- characters stand out: a glowing ring on each start square (gone after the first Go) and a gentle idle bounce ---------- */
.spot{position:absolute;inset:6%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,255,.75) 55%,rgba(255,255,255,0) 72%);
  box-shadow:0 0 0 4px #FF5FA2,0 0 16px 4px rgba(255,95,162,.55);
  animation:spot 1.6s ease-in-out infinite}
.tile.start .face::after{display:none}
.idle{position:absolute;inset:0;transform-origin:50% 92%;animation:idle 2.6s ease-in-out infinite;animation-delay:var(--idle-delay,0s)}
.grid.busy .idle,.grid.won .idle{animation:none}
.spot{transition:opacity .35s}
.grid.played .spot{opacity:0;animation:none}
@keyframes spot{0%,100%{transform:scale(.94);box-shadow:0 0 0 4px #FF5FA2,0 0 10px 2px rgba(255,95,162,.4)}50%{transform:scale(1.02);box-shadow:0 0 0 5px #FF5FA2,0 0 22px 7px rgba(255,95,162,.65)}}
@keyframes idle{
  0%,58%,100%{transform:translateY(0) scale(1,1)}
  29%{transform:translateY(0) scale(1.03,.97)}
  66%{transform:translateY(1%) scale(1.07,.92)}
  76%{transform:translateY(-14%) scale(.95,1.06)}
  86%{transform:translateY(1%) scale(1.05,.95)}
  93%{transform:translateY(0) scale(1,1)}
}
@media (prefers-reduced-motion:reduce){ .spot,.idle{animation:none} }

</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="lead">
      <button class="round" id="mapBtn" aria-label="Pick a level"></button>
      <div class="dots" id="dots" aria-label="Stars in this world"></div>
    </div>
    <button class="gear" id="gear" aria-label="For grown-ups: press and hold"><span class="fill"></span><svg viewBox="0 0 24 24" fill="none" stroke="#1F3A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg></button>
  </header>
  <main class="stage" id="stage">
    <div class="board" id="board"><div class="grid" id="grid"></div></div>
  </main>
  <footer class="foot"><button class="cta" id="cta" aria-label="Go"></button></footer>
</div>

<section class="screen" id="start">
  <h1 class="logo">Path Pals</h1>
  <div class="party" id="startParty"></div>
  <button class="cta" id="play" aria-label="Play"></button>
</section>

<section class="screen map" id="map" hidden>
  <div class="mapwrap">
    <div class="mapbar">
      <button class="round" id="mapBack" aria-label="Back"></button>
      <h2 class="maptitle">Path Pals</h2>
      <button class="gear" id="gear2" aria-label="For grown-ups: press and hold"><span class="fill"></span><svg viewBox="0 0 24 24" fill="none" stroke="#1F3A44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg></button>
    </div>
    <div class="worlds" id="worlds"></div>
  </div>
</section>

<section class="screen cheer" id="cheer" hidden>
  <div class="cheerstars" id="cheerStars"></div>
  <div class="party" id="cheerParty"></div>
  <button class="cta next" id="cheerBtn" aria-label="Next world"></button>
</section>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-label="For grown-ups">
    <h2>For grown-ups</h2>
    <div class="setrows" id="setRows"></div>
    <div class="row">
      <button class="chip" id="hintBtn">Show hint now</button>
      <button class="chip warn" id="resetBtn">Reset progress</button>
    </div>

let ac=null;

function audio(){
  try{
    if(!ac){
      try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
      ac=new (window.AudioContext||window.webkitAudioContext)();
      const b=ac.createBuffer(1,1,22050),src=ac.createBufferSource(); src.buffer=b; src.connect(ac.destination); src.start(0);

// baby penguin: emperor penguin chick calls are short and high pitched (adults are longer and deeper).
// toucan: low, rough, harsh croak repeated, plus bill clacks.  hornbill: Oriental pied hornbill, a loud crackling laugh/cackle.
// otter: smooth-coated otter chirps and musical bubbling, and a harsh "ha".  panda: friendly goat-like bleat; a falling nasal honk when blocked.
// shark: rig sharks are the first sharks recorded making sound: sharp clicks of about 48 ms, mostly single, some doubled.
// baby seal: seal pups use a tonal, wavering contact call to find their mothers; their aggressive calls are higher.

    swipedAt = performance.now();
    if (state.running || state.won) return;
    const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    if (arrowKinds().includes(dir)) placeArrow(x, y, dir);
  });
  el.addEventListener('pointercancel', () => { swipe = null; });
  el.addEventListener('click', () => { if (performance.now() - swipedAt < 450) return; onTap(x, y); });
}
function puff(x, y) {
  const p = document.createElement('div');
  p.className = 'puff';
  p.style.left = `calc(${x + 0.5} * var(--cell))`;
  p.style.top = `calc(${y + 0.5} * var(--cell))`;
  $('animals').appendChild(p);
  setTimeout(() => p.remove(), 600);
}
function joy(o) {
  o.hop.animate([
    { transform: 'translateY(0) scale(1,1) rotate(0deg)' },
    { transform: 'translateY(3%) scale(1.07,.91) rotate(0deg)', offset: 0.14 },
    { transform: 'translateY(-36%) scale(.95,1.07) rotate(-5deg)', offset: 0.5 },
    { transform: 'translateY(3%) scale(1.07,.91) rotate(4deg)', offset: 0.86 },
    { transform: 'translateY(0) scale(1,1) rotate(0deg)' }
  ], { duration: 560, iterations: 4, easing: 'ease-in-out' });
}
function hopAnim(o, dur = STEP * 0.9) {
  o.hop.animate([
    { transform: 'translateY(0) scale(1,1)' },
    { transform: 'translateY(-16%) scale(.96,1.05)' },
    { transform: 'translateY(0) scale(1.05,.95)' },
    { transform: 'translateY(0) scale(1,1)' }
  ], { duration: dur, easing: 'ease-out' });
}
async function run() {
  if (state.running || state.won) return;
  state.running = true;
  clearHint();
  clearTimeout(state.nudge);
  $('cta').classList.remove('nudge');
  $('grid').classList.add('busy', 'played');
  $('cta').disabled = true;
  const L = state.level;
  const sims = L.animals.map(a => walk(L, a, (x, y) => getArrow(x, y)));
  const total = Math.max(...sims.map(s => s.path.length - 1 + (s.result === 'bump' ? 1 : 0)));
  for (let n = 1; n <= total; n++) {
    const bumps = [];
    sims.forEach((s, ai) => {
      const o = state.animals[ai], prev = s.path[n - 1], cur = s.path[n];
      if (cur) {
        o.x = cur.x; o.y = cur.y;
        face(o, prev.dir); hopAnim(o); sfx.step();
        if (cur.dir !== prev.dir) setTimeout(() => { face(o, cur.dir); sfx.turn(); }, STEP * 0.7);
      } else if (n === s.path.length && s.result === 'bump') {
        bumps.push([o, prev, s.bump]);
      }
    });
    spread();                         // settle positions first, then let bumping animals lunge
    bumps.forEach(b => bump(...b));
    await sleep(STEP);
  }
  await sleep(160);
  const wins = sims.map(s => s.result === 'win');
  if (wins.every(Boolean)) await win(); else await fail(sims, wins);
}
// The animal lunges into the obstacle first. The obstacle only reacts once the animal has touched it.
function bump(o, prev, b) {
  const dx = DIRS[prev.dir].dx, dy = DIRS[prev.dir].dy;
  const bx = parseFloat(o.el.style.getPropertyValue('--x')), by = parseFloat(o.el.style.getPropertyValue('--y'));
  o.el.style.transitionDuration = '.16s';
  o.el.style.setProperty('--x', bx + dx * 0.42);
  o.el.style.setProperty('--y', by + dy * 0.42);
  setTimeout(() => {
    cry(o.type, 'hit');
    puff(b.x - dx * 0.5, b.y - dy * 0.5);
    const t = tileEl(b.x, b.y), ob = t && t.querySelector('.obj');
    if (ob) { ob.classList.remove('shake'); void ob.offsetWidth; ob.classList.add('shake'); }
    o.hop.animate([{ transform: 'scale(1,1)' }, { transform: 'scale(.9,1.08)' }, { transform: 'scale(1,1)' }], { duration: 220 });
  }, 150);
  setTimeout(() => {
    o.el.style.transitionDuration = '.22s';
    o.el.style.setProperty('--x', bx);
    o.el.style.setProperty('--y', by);
    setTimeout(() => { o.el.style.transitionDuration = ''; }, 260);
  }, 330);
}
async function fail(sims, wins) {
  if (!sims.some((s, i) => !wins[i] && s.result === 'bump')) sfx.oops();   // a bump already played the animal's own call
  say(pick(['Oops! Try again.', 'Whoops! Change a square.', 'Almost! Try again.']));
  state.animals.forEach((o, i) => {
    if (wins[i]) return;
    if (sims[i].result === 'loop') o.hop.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(720deg)' }], { duration: 800, easing: 'ease-in-out' });
    else o.hop.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-12deg)' }, { transform: 'rotate(10deg)' }, { transform: 'rotate(-6deg)' }, { transform: 'rotate(0)' }], { duration: 520 });
  });
  await sleep(950);
  state.animals.forEach(o => { o.el.style.opacity = 0; });
  await sleep(230);
  state.animals.forEach(o => { o.el.style.transition = 'none'; place(o, o.start.x, o.start.y, 0); face(o, o.start.dir); });
  spread();
  void $('grid').offsetWidth;
  state.animals.forEach(o => { o.el.style.transition = ''; o.el.style.opacity = 1; });
  state.fails++;
  state.running = false;
  $('grid').classList.remove('busy');
  $('cta').disabled = false;
  if (state.hintAfter && state.fails >= state.hintAfter) {
    const h = currentHint();
    if (h) { showHint(h, true); if (state.fails === state.hintAfter) say('Try this one!'); }
  }
  scheduleNudge();
}
function confetti() {
  const fx = $('fx'), cols = ['#2F7DE1', '#F28C28', '#D6336C', '#7048E8', '#FFD166', '#1E9E57'];
  for (let i = 0; i < 34; i++) {
    const p = document.createElement('i');
    p.className = 'piece';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = cols[i % cols.length];
    p.style.animationDelay = Math.random() * 0.5 + 's';
    p.style.animationDuration = 1.5 + Math.random() * 0.9 + 's';
    fx.appendChild(p);
    setTimeout(() => p.remove(), 2800);
  }
}
function cheerCalls(types, start) {   // each animal calls in turn, never on top of each other
  let at = start;
  types.forEach(t => { const d = at; setTimeout(() => cry(t, 'win'), d); at += (CRY_WIN_MS[t] || 1000) + 150; });
}
async function win() {
  state.won = true;
  state.running = false;
  $('grid').classList.add('won');
  progress.done.add(state.i);
  persist();
  $('grid').querySelectorAll('.goal .obj').forEach(g => g.classList.add('eaten'));
  state.animals.forEach(o => { o.flip.dataset.view = 'front'; joy(o); });   // turn to face the player and jump for joy
  sfx.win(); confetti();
  say(pick(['Yay! You did it!', 'Great planning!', 'Hooray!']));
  cheerCalls(state.animals.map(o => o.type), 520);
  renderDots();
  await sleep(1300);
  setCTA('next');
}
function advance() {
  const i = state.i, wi = LEVELS[i].world, n = i + 1;
  if (n >= LEVELS.length) return showCheer('final', wi);
  if (LEVELS[n].world !== wi) return showCheer('world', wi);
  load(n, true);
}

// ---------- screens ----------
function show(id) { ['start', 'map', 'cheer'].forEach(s => { $(s).hidden = s !== id; }); }
function onGameScreen() { return $('start').hidden && $('map').hidden && $('cheer').hidden; }

function showCheer(kind, wi) {
  $('cheerParty').innerHTML = ALL_ANIMALS.map(t => FRONT[t]()).join('');
  const count = kind === 'final' ? WORLDS.length : WORLD_LEVELS[wi].length;
  $('cheerStars').innerHTML = Array.from({ length: count }, () => `<svg class="star done" viewBox="0 0 24 24" aria-hidden="true">${STAR}</svg>`).join('');
  $('cheerStars').classList.toggle('many', count > 6);
  // Calls: the characters from the last level first, then a few others, so it stays short.
  const types = [...new Set(state.types.concat(shuffled(ALL_ANIMALS)))].slice(0, kind === 'final' ? 5 : 3);
  const b = $('cheerBtn');
  b.dataset.mode = kind;
  b.dataset.world = wi;
  b.innerHTML = kind === 'final' ? ICON.map : ICON.next;
  b.setAttribute('aria-label', kind === 'final' ? 'Pick a level' : 'Next world');
  show('cheer');
  confetti(); sfx.win();
  say(kind === 'final' ? 'You finished every level! Great planning!' : 'You finished this world! On to the next one!');
  cheerCalls(types, 600);
}

function renderMap() {
  const now = firstOpen();
  $('worlds').innerHTML = WORLDS.map((w, wi) => {
    const btns = WORLD_LEVELS[wi].map(i => {
      const L = LEVELS[i], done = progress.done.has(i), open = isUnlocked(i);
      const cls = ['lvl', done ? 'done' : '', i === now ? 'now' : '', open ? '' : 'locked'].filter(Boolean).join(' ');
      const cells = L.grid.join('').split('').map(c => `<i class="${c === '.' ? '' : c}"></i>`).join('');
      const label = `Level ${i + 1}` + (L.animals.length > 1 ? `, ${L.animals.length} friends` : '') + (done ? ', finished' : open ? '' : ', locked');
      return `<button class="${cls}" data-i="${i}" aria-label="${label}"><span class="thumb" style="--n:${L.grid.length}">${cells}</span>${done ? `<svg class="badge" viewBox="0 0 24 24">${STAR}</svg>` : ''}${open ? '' : LOCK}</button>`;
    }).join('');
    const tag = w.bonus
      ? `<div class="wtag bonus" aria-label="Bonus: each friend has their own snack"><span class="duo">${GOALSVG.fish}${GOALSVG.peanuts}</span></div>`
      : `<div class="wtag" aria-label="${w.size} by ${w.size} squares"><span class="mini" style="--n:${w.size}">${'<i></i>'.repeat(w.size * w.size)}</span></div>`;
    return `<section class="world w-${w.id}">${tag}<div class="lvls">${btns}</div></section>`;
  }).join('');
  $('worlds').querySelectorAll('.lvl').forEach(b => b.addEventListener('click', () => {
    audio();
    const i = Number(b.dataset.i);
    if (!isUnlocked(i)) { b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope'); sfx.oops(); return; }
    show(null);
    load(i, true);
  }));
}
function openMap() {
  if (state.running) return;
  renderMap();
  show('map');
  const target = $('worlds').querySelector('.lvl.now') || $('worlds').querySelector(`.lvl[data-i="${state.i}"]`);
  if (target) target.scrollIntoView({ block: 'center' });
}

// ---------- grown-ups panel (press and hold the gear) ----------
function attachGate(g) {
  let t = null;
  const stop = () => { clearTimeout(t); g.classList.remove('holding'); };
  g.addEventListener('pointerdown', e => { e.preventDefault(); g.classList.add('holding'); t = setTimeout(() => { stop(); openSheet(); }, 900); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => g.addEventListener(ev, stop));
  g.addEventListener('contextmenu', e => e.preventDefault());
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(); } });
}
function openSheet() { renderSheet(); $('sheet').hidden = false; }
function closeSheet() { $('sheet').hidden = true; disarmReset(); }
function renderSheet() {
  const seg = (key, opts, cur) => `<div class="seg" role="group">${opts.map(([v, label]) =>
    `<button class="chip" data-k="${key}" data-v="${v}" aria-pressed="${v === cur}">${label}</button>`).join('')}</div>`;
  $('setRows').innerHTML = [
    `<div class="setrow"><span class="lab">Sound</span>${seg('sound', [[1, 'On'], [0, 'Off']], +state.sound)}</div>`,
    `<div class="setrow"><span class="lab">Voice prompts</span>${seg('voice', [[1, 'On'], [0, 'Off']], +state.voice)}</div>`,
    `<div class="setrow"><span class="lab">Arrows to choose from</span>${seg('arrows', [[1, 'All four'], [0, 'Only the ones needed']], +(state.arrowMode === 'all'))}</div>`,
    `<div class="setrow"><span class="lab">Hint appears after</span>${seg('hint', [[2, '2 tries'], [3, '3 tries'], [0, 'Never']], state.hintAfter)}</div>`,
    `<div class="setrow"><span class="lab">Levels</span>${seg('unlock', [[0, 'Unlock in order'], [1, 'All open']], +progress.unlockAll)}</div>`
  ].join('');
  $('setRows').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k, v = Number(b.dataset.v);
    if (k === 'sound') state.sound = !!v;
    if (k === 'voice') { state.voice = !!v; if (!v && 'speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} } }
    if (k === 'hint') state.hintAfter = v;
    if (k === 'arrows') { state.arrowMode = v ? 'all' : 'needed'; state.sol = null; }
    if (k === 'unlock') { progress.unlockAll = !!v; if (!$('map').hidden) renderMap(); }
    persist();
    renderSheet();
  }));
  $('hintBtn').disabled = !(onGameScreen() && state.level && !state.running && !state.won);
}
let resetTimer = null;
function disarmReset() { clearTimeout(resetTimer); const b = $('resetBtn'); b.classList.remove('armed'); b.textContent = 'Reset progress'; }
$('resetBtn').addEventListener('click', () => {
  const b = $('resetBtn');
  if (!b.classList.contains('armed')) {   // two taps, since the page cannot show a confirm dialog
    b.classList.add('armed');
    b.textContent = 'Tap again to reset';
    resetTimer = setTimeout(disarmReset, 3500);
    return;
  }
  disarmReset();
  progress.done.clear();
  progress.unlockAll = false;
  persist();
  closeSheet();
  load(0, false);
  show('start');
});
$('hintBtn').addEventListener('click', () => {
  closeSheet();
  if (onGameScreen() && !state.running && !state.won) { const h = currentHint(); if (h) showHint(h, true); }
});
$('closeBtn').addEventListener('click', closeSheet);
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });

// ---------- buttons ----------
$('cta').addEventListener('click', () => { audio(); if ($('cta').dataset.mode === 'next') advance(); else run(); });
$('play').addEventListener('click', () => {
  audio();
  const i = firstOpen();
  if (i < 0) { openMap(); return; }
  show(null);
  load(i, true);
});
$('mapBtn').addEventListener('click', () => { audio(); openMap(); });
$('mapBack').addEventListener('click', () => { if (state.level) show(null); else show('start'); });
$('cheerBtn').addEventListener('click', () => {
  audio();
  const b = $('cheerBtn');
  if (b.dataset.mode === 'final') { openMap(); return; }
  const lv = WORLD_LEVELS[Number(b.dataset.world)];
  show(null);
  load(lv[lv.length - 1] + 1, true);
});
attachGate($('gear'));
attachGate($('gear2'));

// ---------- boot ----------
loadSave();
$('play').innerHTML = ICON.go;
$('mapBtn').innerHTML = ICON.map;
$('mapBack').innerHTML = ICON.back;
$('startParty').innerHTML = ALL_ANIMALS.map(t => FRONT[t]()).join('');
new ResizeObserver(sizeBoard).observe($('stage'));
window.addEventListener('resize', sizeBoard);
{ const f = firstOpen(); load(f < 0 ? 0 : f, false); }

</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
